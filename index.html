<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.1: Draw SVGs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Exercise 4.1: Drawing with SVG</h1>
    <p>A house and garden built from SVG primitives.</p>
  </header>

  <main>
    <section>
      <h2>My SVG Picture</h2>

      <svg width="600" height="400" viewBox="0 0 600 400">

        <!-- RECT: sky background -->
        <rect x="0" y="0" width="600" height="400" fill="#BFE6FF" />

        <!-- CIRCLE: sun -->
        <circle cx="520" cy="70" r="35" fill="#FFD43B" />

        <!-- ELLIPSE: clouds -->
        <ellipse cx="150" cy="60" rx="50" ry="20" fill="white" />
        <ellipse cx="190" cy="50" rx="40" ry="18" fill="white" />

        <!-- RECT: ground -->
        <rect x="0" y="340" width="600" height="60" fill="#6BBF59" />

        <!-- RECT: house body -->
        <rect x="150" y="180" width="300" height="170" fill="#F4D6A0" stroke="#5C4033" stroke-width="3" />

        <!-- POLYGON: roof -->
        <polygon points="130,180 300,80 470,180" fill="#B23A48" stroke="#5C4033" stroke-width="3" />

        <!-- RECT: door -->
        <rect x="270" y="270" width="60" height="80" fill="#8B5A2B" stroke="#5C4033" stroke-width="2" />

        <!-- CIRCLE: door knob -->
        <circle cx="318" cy="312" r="4" fill="#FFD43B" />

        <!-- RECT + LINE: left window -->
        <rect x="180" y="210" width="60" height="50" fill="#AEE1F9" stroke="#333" stroke-width="3" />
        <line x1="210" y1="210" x2="210" y2="260" stroke="#333" stroke-width="3" />
        <line x1="180" y1="235" x2="240" y2="235" stroke="#333" stroke-width="3" />

        <!-- RECT + LINE: right window -->
        <rect x="360" y="210" width="60" height="50" fill="#AEE1F9" stroke="#333" stroke-width="3" />
        <line x1="390" y1="210" x2="390" y2="260" stroke="#333" stroke-width="3" />
        <line x1="360" y1="235" x2="420" y2="235" stroke="#333" stroke-width="3" />

        <!-- RECT + CIRCLE: tree -->
        <rect x="60" y="250" width="20" height="100" fill="#7A4E2D" />
        <circle cx="70" cy="230" r="45" fill="#2E8B57" />

        <!-- POLYLINE: picket fence -->
        <polyline points="470,345 470,305 485,290 500,305 500,345 500,305 515,290 530,305 530,345 530,305 545,290 560,305 560,345"
                  fill="none" stroke="white" stroke-width="3" />

        <!-- PATH: garden path to the door -->
        <path d="M 280 350 C 270 370, 230 380, 220 400 L 340 400 C 330 380, 320 370, 320 350 Z"
              fill="#C2B280" stroke="#8C7B55" stroke-width="2" />

        <!-- TEXT: title -->
        <text x="20" y="390" font-family="Arial, sans-serif" font-size="20" fill="#333">Sporsho's House</text>

      </svg>
    </section>
  </main>
</body>
</html>
